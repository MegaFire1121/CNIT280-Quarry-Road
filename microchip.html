<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="style.css" />
  <title>Quarry Road Medical Portal - Microchip Lookup</title>
</head>
<body>

  <div id="container">
    <div id="header">
      <div id="header_title">
        <h1>Quarry Road Portal</h1>
      </div>

      <div id="header_links">
        <ul>
          <li id="home"><a href="index.html">Home</a></li>
          <li id="staff"><a href="staff.html">Staff</a></li>
          <li id="adopter"><a href="adopter.html">Adopter</a></li>
          <li id="medical"><a href="medical.html">Medical</a></li>
          <li id="volunteer"><a href="volunteer.html">Volunteer</a></li>
          <li id="foster"><a href="foster.html">Foster</a></li>
          <li id="login"><a href="login.html">Login</a></li>
        </ul>
      </div>
    </div>

    <div id="content_main">
      <div class="content_main_text">
                <h2><a>Microchip Lookup</a></h2>
        
        <label for="chip">Microchip Number:</label>
        <input type="text" id="chip" name="chip" required>
        <p> </p>

        <button type="button" id="search-btn">Search</button>
        <div id="search-results" style="margin-top: 20px;"></div>
         
  
      </div>



    <div id="footer">

    </div>

  </div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const searchBtn = document.getElementById("search-btn");
    if (!searchBtn) return;

    searchBtn.addEventListener("click", () => {
    const chipInput = document.getElementById("chip").value.trim();
    const resultsContainer = document.getElementById("search-results");

    if (!chipInput) {
      resultsContainer.innerHTML = "<p style='color: red;'>ERROR: NO CHIP NUMBER ENTERED.</p>";
      return;
    }
      const records = JSON.parse(localStorage.getItem("tableData")) || [];
      const matchedPet = records.find(pet => String(pet.chip) === chipInput);

      if (matchedPet) {
          const formattedAvail = matchedPet.avail === "yes" ? "Available" : "Not Available";
          resultsContainer.innerHTML = `
            <h3>Match Found:</h3>
            <table border="1" style="border-collapse: collapse; width: 100%; margin-top: 10px;">
              <thead>
                <tr>
                  <th>Pet Name</th>
                  <th>ID #</th>
                  <th>Microchip #</th>
                  <th>Availability</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>${matchedPet.name || ""}</td>
                  <td>${matchedPet.id || ""}</td>
                  <td>${matchedPet.chip || ""}</td>
                  <td>${formattedAvail}</td>
                </tr>
              </tbody>
            </table>
          `;
        } else {
          resultsContainer.innerHTML = `<p style="color: #666;">ERROR: There is no animal with that microchip number: <strong>${chipInput}</strong></p>`;
        }
      });
  });
</script>
</body>
</html>
