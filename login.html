<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="style.css" />
  <title>Quarry Road Portal - Log On</title>
</head>
<body>

  <div id="container">
    <div id="header">
      <div id="header_title">
        <h1>Quarry Road Portal</h1>
      </div>

      <div id="header_links">
        <ul>
          <li id="home"><a href="index.html">Home</a></li>
          <li id="staff"><a href="staff.html">Staff</a></li>
          <li id="adopter"><a href="adopter.html">Adopter</a></li>
          <li id="medical"><a href="medical.html">Medical</a></li>
          <li id="volunteer"><a href="volunteer.html">Volunteer</a></li>
          <li id="foster"><a href="foster.html">Foster</a></li>
          <li id="login"><a href="login.html">Login</a></li>
        </ul>
      </div>
    </div>

    <div id="content_main">
      <div class="content_main_text">
                <h2><a>User Portal</a></h2>
        <form onsubmit="event.preventDefault(); validateLogin();">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <p> </p>
          <label for="username">Password:</label>
          <input type="text" id="password" name="password" required>
         <p> </p>
        
        <button type="submit">Log In</button>
          </form>
        <script>
            function validateLogin() {
                const user = document.getElementById("username").value;
                const pass = document.getElementById("password").value;
                if (user === "admin" && pass === "password123") {
                    window.location.href = "director.html"; 
                }
                else if (user === "adopter" && pass === "DogCatLover69") {
                  window.location.href = "adopter.html";
                }
                else {
                    alert("Incorrect username or password. Please try again.");
                }
            }
        </script>
        <p>&nbsp;</p>
      </div>

  

    <div id="footer">

    </div>

  </div>

</body>
</html>
