<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="style.css" />
  <title>Quarry Road Portal - View Applications</title>
</head>
<body>

  <div id="container">
    <div id="header">
      <div id="header_title">
        <h1>Quarry Road Portal</h1>
      </div>

      <div id="header_links">
        <ul>
          <li id="home"><a href="index.html">Home</a></li>
          <li id="staff"><a href="staff.html">Staff</a></li>
          <li id="adopter"><a href="adopter.html">Adopter</a></li>
          <li id="medical"><a href="medical.html">Medical</a></li>
          <li id="volunteer"><a href="volunteer.html">Volunteer</a></li>
          <li id="foster"><a href="foster.html">Foster</a></li>
          <li id="login"><a href="login.html">Login</a></li>
        </ul>
      </div>
    </div>

    <div id="content_main">
      <div class="content_main_text" style="padding-left: 40px;">
        <h2>Find Pet Adoption Application</h2>
        <form id="searchApps">
          <label for="id">Pet ID #:</label>
          <input type="text" id="id" name="id" required>
          <p> </p>


          <button type="submit">Search</button>
        </form>

        <div id="searchResults" style="margin-top: 20px;"></div>

        <script>
          document.getElementById('searchApps').addEventListener('submit', function(event) {
            event.preventDefault();

            const targetId = document.getElementById('id').value.trim();
            const resultsContainer = document.getElementById('searchResults');
             
            let existingEntries = JSON.parse(localStorage.getItem('tableData')) || [];
           
            const matchedPet = existingEntries.find(pet => String(pet.id).trim() === targetId);
          
            
           

            if (matchedPet) {
                
                const statusLabels = {
                  'yes': 'Available',
                  'no': 'Not Available',
                  'pending': 'Pending Adoption',
                  'adopted': 'Adopted'
                };
                const displayStatus = statusLabels[matchedPet.avail] || matchedPet.avail || 'Unknown';

                resultsContainer.innerHTML = `
                  <h3>Pet Found:</h3>
                  <p><strong>Name:</strong> ${matchedPet.name}</p>
                  <p><strong>ID #:</strong> ${matchedPet.id}</p>
                  <p><strong>Microchip #:</strong> ${matchedPet.chip}</p>
                  <p><strong>Status:</strong> ${displayStatus}</p>
                `;
              } else {
                resultsContainer.innerHTML = '';
                alert('ERROR: No pet found with ID #' + targetId);
              }
            });
        </script>
        <p>&nbsp;</p>
      </div>
    </div>

    <div id="footer">
    </div>

  </div>

</body>
</html>
