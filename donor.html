<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="style.css" />
  <title>Quarry Road Portal - Donor Portal</title>
</head>
<body>

  <div id="container">
    <div id="header">
      <div id="header_title">
        <h1>Quarry Road Portal</h1>
      </div>

      <div id="header_links">
        <ul>
          <li id="home"><a href="index.html">Home</a></li>
          <li id="staff"><a href="staff.html">Staff</a></li>
          <li id="adopter"><a href="adopter.html">Adopter</a></li>
          <li id="medical"><a href="medical.html">Medical</a></li>
          <li id="volunteer"><a href="volunteer.html">Volunteer</a></li>
          <li id="foster"><a href="foster.html">Foster</a></li>
          <li id="login"><a href="login.html">Login</a></li>
        </ul>
      </div>
    </div>

    <div id="content_main">
      <div class="content_main_text">
                <h2><a>Donor Portal</a></h2>
        
        
          <form id="donationForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <p> </p>
              <label for="id">ID #:</label>
              <input type="text" id="id" name="id" required>
             <p> </p>
            <label for="amount">Donation Amount: $</label>
              <input type="text" id="amount" name="chip" required>
            <p> </p>
            <button type="submit">Submit</button>
              </form>


        
        <script>
          document.getElementById('donationForm').addEventListener('submit', function(event) {
          event.preventDefault();

          const name = document.getElementById('name').value;
            const id = document.getElementById('id').value;
            const amount = document.getElementById('amount').value;

          const existingEntries = JSON.parse(localStorage.getItem('donationData')) || [];
          existingEntries.push({ name: name, id: id, amount: amount });
          localStorage.setItem('donationData', JSON.stringify(existingEntries));

          this.reset();
          alert('Your donation has been recieved. Thank you!');
          });
        </script>
       
      </div>

</div>

    <div id="footer">

    </div>

  </div>

</body>
</html>
